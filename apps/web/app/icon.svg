<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#22577A"/>
  <!-- Z as a polyline with chunky rounded stroke. Renders cleanly down to
       16x16 favicon size; no font dependency. -->
  <polyline
    points="17,18 47,18 17,46 47,46"
    fill="none"
    stroke="#FAFAF8"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
