# Render Blueprint — services/api (FastAPI backend for Zola)
#
# Docs: https://render.com/docs/blueprint-spec
#
# After this blueprint is applied in the Render dashboard the FIRST time, env
# vars marked `sync: false` need to be filled in manually (Render won't pull
# secrets from local). After that, pushes to `main` redeploy automatically.

services:
  - type: web
    name: zola-api
    runtime: python
    plan: free   # Sleeps after 15min idle on first request. Upgrade to "starter" ($7/mo) once invitees exist.
    region: oregon   # Closest region for typical Supabase US East workloads is fine; pick whatever's nearest your Supabase project.
    branch: main
    rootDir: services/api
    autoDeploy: true
    # Install requirements.txt AND the workspace ingest package, which
    # `routers/ingest.py` imports for the admin-triggered manual ingest.
    # (Path is relative to rootDir, so ../../packages/ingest resolves to
    # <repo>/packages/ingest.)
    buildCommand: pip install -r requirements.txt && pip install ../../packages/ingest
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # ---- Runtime ----
      # Python version is controlled via this env var on Render (the older
      # service-level `pythonVersion` field was removed from the blueprint schema).
      - key: PYTHON_VERSION
        value: "3.12.7"
      # ---- Public configuration ----
      - key: SUPABASE_URL
        sync: false   # set from your local .env's NEXT_PUBLIC_SUPABASE_URL
      # ---- Secrets ----
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # service-role key from Supabase project settings
      - key: SUPABASE_JWT_SECRET
        sync: false   # legacy HS256 secret; can be empty if project uses modern JWKS only
      - key: DATABASE_URL
        sync: false   # the asyncpg connection string from your local .env
      # NOTE: We do NOT need RESEND_API_KEY on Render. The /admin/invites
      # endpoint calls Supabase Auth's /auth/v1/invite, and Supabase itself
      # sends the email via the provider configured in the Supabase dashboard.
      # ---- Hosting metadata Render injects automatically (no need to set) ----
      # PORT — Render-assigned
