name: Keep Render awake

# Pings the FastAPI /healthz endpoint every 10 minutes so the Render free tier
# (sleeps after 15 min idle) stays warm. Costs nothing (well under GH Actions
# free minutes). Trigger to remove this workflow: upgrading Render to Starter
# ($7/mo always-on) — at that point this becomes pointless overhead.

on:
  schedule:
    # Every 10 minutes. GitHub may occasionally skip a run during high load;
    # 10 min is conservative enough that a missed slot still leaves a buffer
    # before Render's 15-min sleep threshold.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /healthz
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$RENDER_API_URL" ]; then
            echo "RENDER_API_URL secret not set yet — skipping (set it once the Render service is live)."
            exit 0
          fi
          # --max-time 90 generous enough that a cold start (30–60s) still
          # succeeds; we'd rather wait than retry on a wake-up.
          status=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 90 "$RENDER_API_URL/healthz" || echo "000")
          echo "HTTP $status from $RENDER_API_URL/healthz"
          if [ "$status" != "200" ]; then
            echo "::warning::Healthz returned $status. Body:"
            cat /tmp/body || true
            exit 1
          fi
