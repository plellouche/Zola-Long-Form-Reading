name: Ingest RSS feeds

on:
  schedule:
    # Every 6 hours, on the hour (UTC). 4 runs/day × 30 sources = ~120 feed fetches/day.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Single source slug (leave empty to ingest all active)'
        required: false
        default: ''

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # bumped from 20 for embeddings step
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            packages/ingest/pyproject.toml

      - name: Install ingestion package (with embeddings extra)
        run: |
          python -m pip install --upgrade pip
          pip install './packages/ingest[embeddings]'

      # Cache the sentence-transformers model (~80MB) so we don't re-download
      # on every cron tick. Cache key bumps when the model name changes.
      - name: Cache sentence-transformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-all-MiniLM-L6-v2-v1

      - name: Ingest
        run: |
          set -e
          if [ -n "${{ inputs.source }}" ]; then
            python -m longform_ingest --source "${{ inputs.source }}" -v
          else
            python -m longform_ingest --all
          fi

      # Embed any articles inserted by the ingest step. Cap per-run so a
      # large historical backfill doesn't time out the job; the cron will
      # finish the rest on subsequent ticks.
      - name: Backfill embeddings
        run: |
          python -m longform_ingest.backfill_embeddings --limit 500
