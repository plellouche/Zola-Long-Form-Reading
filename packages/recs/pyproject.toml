[project]
name = "longform-recs"
version = "0.0.0"
description = "Recommendation engine: scoring, ranking, diversity (Phase 7)."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
