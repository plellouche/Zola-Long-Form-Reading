[project]
name = "longform-ingest"
version = "0.1.0"
description = "RSS + OpenGraph ingestion pipeline for the Longform reading app."
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "python-dateutil>=2.9.0",
  "beautifulsoup4>=4.12.3",
  "asyncpg>=0.30.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Heavy ML deps; only needed for the embedding backfill job (GitHub Actions).
# Render API doesn't need them — embeddings get computed in the GHA cron.
# Install with: pip install '.[embeddings]'
embeddings = [
  "sentence-transformers>=3.3.0",
  "torch>=2.4.0",  # CPU-only is fine; sentence-transformers pulls a torch variant
]

[project.scripts]
longform-ingest = "longform_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
